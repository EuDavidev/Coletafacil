name: Build Android APK
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile APK, lint and verify core
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:lintDebug :core:check --stacktrace
      - name: Independently inspect generated spreadsheets
        run: |
          python3 -m pip install openpyxl==3.1.5
          python3 tools/verify-exports.py
      - uses: actions/upload-artifact@v4
        with:
          name: ColetaFacil-APK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
